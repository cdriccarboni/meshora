# MESHORA — vérifications automatiques de chaque pull request (aucun secret, aucun déploiement, aucune signature).
# Ce que ça vérifie : tests web, vecteurs communs, conformité des DEUX relais (Node et vrai Worker via
# `wrangler dev` en local), tests unitaires Android dont l'interopérabilité Android ↔ web à travers un relais local,
# et lint Android. Les rapports sont joints à chaque exécution.
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Vérification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # « -eo pipefail » : un test en échec fait échouer l'étape même à travers « | tee »

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-et-relais:
    name: Web, vecteurs et relais
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Dépendances web
        working-directory: prototype
        run: npm ci --no-audit --no-fund
      - name: Typage TypeScript
        working-directory: prototype
        run: npm run lint
      - name: Tests web (dont vecteurs Python ↔ TypeScript et confidentialité persistante)
        working-directory: prototype
        run: npm test 2>&1 | tee ../rapport-web.log
      - name: Référence Python des vecteurs (régénérée et relue)
        run: |
          pip install --quiet cryptography
          python3 tools/audit/prekey-reference.py /tmp/prekey-vectors-ci.json
          python3 tools/audit/group-seal-reference.py > /tmp/group-seal-ci.json
          python3 - <<'PY'
          import json
          a = json.load(open('/tmp/group-seal-ci.json')); b = json.load(open('docs/tests/v0.3/group-seal-vectors.json'))
          assert a == b, 'vecteurs de scellement Bluetooth différents de la référence'
          print('vecteurs de scellement : identiques à la référence')
          PY
      - name: Conformité du relais Node
        run: |
          PORT=8787 HOST=127.0.0.1 node tools/relay/server.js > /tmp/relay-node.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8787/health >/dev/null && break; sleep 0.25; done
          cd prototype && RELAY=ws://127.0.0.1:8787 npx tsx ../tools/audit/relay-conformance.ts 2>&1 | tee ../rapport-relais-node.log
          kill %1 || true
      - name: Vrai code du relais Cloudflare (hors wrangler)
        working-directory: prototype
        run: npx tsx ../tools/audit/cf-relay-harness.mjs 2>&1 | tee ../rapport-relais-cloudflare-banc.log
      - name: Conformité du relais Cloudflare (wrangler dev, local, sans compte)
        env:
          WRANGLER_SEND_METRICS: "false"
          CI: "true"
        run: |
          cd relay/cloudflare
          npx --yes wrangler@4 dev --env dev --ip 127.0.0.1 --port 8788 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:8788/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8788/health || { cat /tmp/wrangler.log; exit 1; }
          cd ../../prototype && RELAY=ws://127.0.0.1:8788 npx tsx ../tools/audit/relay-conformance.ts 2>&1 | tee ../rapport-relais-wrangler.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-web-et-relais
          path: rapport-*.log

  android:
    name: Android (tests unitaires, interopérabilité, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Dépendances web (robot d'écho pour l'interopérabilité)
        working-directory: prototype
        run: npm ci --no-audit --no-fund
      - name: Tests unitaires Android + interopérabilité Android ↔ web via un relais local
        env:
          GRADLE_FLAGS: "--no-daemon"
        run: bash tools/audit/interop-android.sh 2>&1 | tee rapport-android.log
      - name: Lint Android
        working-directory: android
        run: ./gradlew --no-daemon -q lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-android
          path: |
            rapport-android.log
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/lint-results-debug.html
