<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- MESHORA Minimalist Orbital Logo -->
  <rect width="128" height="128" rx="28" fill="#121316"/>
  <!-- Outer Orbit -->
  <circle cx="64" cy="64" r="44" stroke="#4a5060" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.65"/>
  <!-- Middle Orbit (Tilted ellipse) -->
  <ellipse cx="64" cy="64" rx="46" ry="24" transform="rotate(-30 64 64)" stroke="#60a5fa" stroke-width="2" opacity="0.85"/>
  <!-- Inner Orbit -->
  <circle cx="64" cy="64" r="26" stroke="#94a3b8" stroke-width="1.75" opacity="0.5"/>
  <!-- Central Core Node -->
  <circle cx="64" cy="64" r="9" fill="#f8fafc"/>
  <circle cx="64" cy="64" r="5" fill="#3b82f6"/>
  <!-- Orbital Satellite Nodes -->
  <circle cx="26" cy="42" r="4" fill="#60a5fa"/>
  <circle cx="102" cy="86" r="4" fill="#93c5fd"/>
  <circle cx="64" cy="20" r="3.5" fill="#f8fafc"/>
</svg>
