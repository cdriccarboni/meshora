<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-labelledby="t">
  <title id="t">MESHORA</title>
  <!-- Logo officiel MESHORA (géométrie de OrbitalLogo.tsx, prototype Google AI Studio V0.2), version transparente clair/sombre -->
  <style>
    .o1{transform-origin:50px 50px;animation:spin 24s linear infinite}.o2{transform-origin:50px 50px;animation:spin 40s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){.o1,.o2{animation:none}}
    .core{fill:#121316}.dot{fill:#3B82F6}.ell{stroke:#3B82F6}.out{stroke:#94A3B8}.s1{fill:#3B82F6}.s2{fill:#94A3B8}
    @media (prefers-color-scheme: dark){.core{fill:#F8FAFC}.ell{stroke:#60A5FA}.out{stroke:#4A5060}.s1{fill:#60A5FA}.s2{fill:#E5E5E5}}
  </style>
  <g class="o2"><circle class="out" cx="50" cy="50" r="38" stroke-width="1.5" stroke-dasharray="3 5"/>
  <circle class="s2" cx="78" cy="24" r="2.5"/></g>
  <g class="o1"><ellipse class="ell" cx="50" cy="50" rx="36" ry="19" transform="rotate(-28 50 50)" stroke-width="1.8"/>
  <circle class="s1" cx="20" cy="36" r="3"/></g>
  <circle class="core" cx="50" cy="50" r="7"/>
  <circle class="dot" cx="50" cy="50" r="4"/>
</svg>
